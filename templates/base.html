<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DBMS Food Delivery Project</title>
    <style>
        :root { --primary: #ff4757; --secondary: #2ed573; --dark: #2f3542; --light: #f1f2f6; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; line-height: 1.6; margin: 0; padding: 20px; background: #f8f9fa; color: #333; }
        
        /* Modern Navbar */
        nav { background: linear-gradient(135deg, var(--dark), #57606f); padding: 18px 25px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; justify-content: space-between;}
        nav a { color: white; text-decoration: none; margin-right: 20px; font-weight: 600; letter-spacing: 0.5px; transition: 0.3s; }
        nav a:hover { color: var(--secondary); }
        
        .container { max-width: 950px; margin: 0 auto; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        
        /* Sleek Cards */
        .card { border: none; padding: 20px; margin-bottom: 20px; border-radius: 12px; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 5px solid var(--primary); display: flex; justify-content: space-between; align-items: center; transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        
        /* Gradient Buttons */
        .btn { background: linear-gradient(135deg, #ff6b81, var(--primary)); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; text-decoration: none; font-weight: 600; font-size: 14px; transition: 0.3s; box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3); }
        .btn:hover { background: linear-gradient(135deg, var(--primary), #ff4757); transform: translateY(-1px); }
        .btn-secondary { background: linear-gradient(135deg, #7bed9f, var(--secondary)); box-shadow: 0 4px 10px rgba(46, 213, 115, 0.3); color: #1a1a1a; }
        .btn-secondary:hover { background: linear-gradient(135deg, var(--secondary), #2ed573); }
        
        /* Modern Tables */
        table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 20px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        th, td { border-bottom: 1px solid #eee; padding: 15px; text-align: left; }
        th { background: var(--dark); color: white; font-weight: 600; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; }
        tr:last-child td { border-bottom: none; }
        
        .badge { background: #ffa502; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <div>
                <a href="{{ url_for('home') }}">🍽️ Food Delivery System</a>
            </div>
            <div>
                <a href="{{ url_for('view_cart') }}">🛒 Cart ({% if session.get('cart') %}{{ session['cart']|length }}{% else %}0{% endif %})</a>
            </div>
        </nav>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
