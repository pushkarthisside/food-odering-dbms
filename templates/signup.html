{% extends "base.html" %}
{% block title %}Create account — QuickBite{% endblock %}

{% block extra_head %}
<style>
  .auth-wrap {
    min-height: calc(100vh - 60px);
    display: flex; align-items: center; justify-content: center;
    padding: 32px 24px;
  }
  .auth-card {
    width: 100%; max-width: 460px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px 36px;
  }
  .auth-logo {
    font-family: 'Fraunces', serif;
    font-size: 2rem;
    color: var(--accent);
    text-align: center;
    margin-bottom: 6px;
  }
  .auth-logo span { color: var(--text); }
  .auth-tagline { text-align: center; color: var(--muted); font-size: .88rem; margin-bottom: 28px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .auth-footer { text-align: center; margin-top: 20px; font-size: .88rem; color: var(--muted); }
  .auth-footer a { color: var(--accent); font-weight: 600; }
  @media(max-width:420px){ .two-col{ grid-template-columns:1fr; } }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">Quick<span>Bite</span></div>
    <p class="auth-tagline">Join thousands of happy diners</p>

    <form method="POST">
      <div class="two-col">
        <div class="form-group">
          <label class="form-label" for="name">Full name</label>
          <input class="form-input" type="text" id="name" name="name"
                 placeholder="Pushkar" required autofocus>
        </div>
        <div class="form-group">
          <label class="form-label" for="phone">Phone</label>
          <input class="form-input" type="tel" id="phone" name="phone"
                 placeholder="+91 98765 43210">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" type="email" id="email" name="email"
               placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="address">Delivery address</label>
        <input class="form-input" type="text" id="address" name="address"
               placeholder="123 Main St, Bangalore">
      </div>
      <div class="two-col">
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" name="password"
                 placeholder="Min. 6 chars" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm</label>
          <input class="form-input" type="password" id="confirm_password" name="confirm_password"
                 placeholder="Repeat password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="margin-top:8px;">
        Create account
      </button>
    </form>

    <p class="auth-footer">
      Already have one? <a href="{{ url_for('login') }}">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
